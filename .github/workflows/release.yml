# Builds the macOS .pkg, Windows setup.exe and .zip, Linux .tar.gz and Android .apk and
# publishes them as a GitHub Release.
#
# - Push a tag v<version> (scripts/release.sh does the bump, commit and tag):
#   builds that tag and creates the Release.
# - Run manually (Actions → Release → Run workflow):
#   - with a tag, e.g. v0.15.0: builds that tag and creates its Release
#   - without a tag: test build of main; installers are kept as workflow
#     artifacts only, nothing is published
#
# Everything builds on one macOS runner: the packaging scripts use Xcode, sips,
# pkgbuild and BSD sed, and the shared data needs macOS's English word list.
#
# Android signing: set the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the
# .jks file), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
# Without them the APK is debug-signed and only kept in test builds, not released.
#
# Windows signing (SignPath; the free Foundation program turned the project down in
# 2026-11, a paid subscription works the same way): set the repository
# variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN. Then each tagged
# release submits both setup.exe files to SignPath, waits for an approver to accept the
# request on signpath.io, and publishes the signed files. Without them, or in test
# builds, the installers stay unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.15.0). Leave empty for a test build of main."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120   # includes waiting for the SignPath approval
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python3 -m pip install --quiet numpy

      - name: Install NSIS and mingw-w64 (Windows installers, stand-alone text service)
        run: brew install makensis mingw-w64

      - name: Use the runner's Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Check that the tag matches the app version
        if: env.TAG != ''
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match Info.plist version $VERSION"
            exit 1
          fi

      - name: Cache downloaded model and numpy wheels
        uses: actions/cache@v4
        with:
          path: |
            build/models
            build/numpy-vendor
            build/downloads
          key: downloads-${{ hashFiles('scripts/fetch-lm.sh', 'windows/tools/fetch_numpy.py', 'scripts/fetch-pime.sh', 'scripts/fetch-python-embed.sh') }}

      - name: Swift tests
        run: xcrun swift test

      - name: Build macOS installer
        run: scripts/package.sh

      - name: Build Windows package (runs the Python tests)
        run: scripts/package-windows.sh

      - name: Build stand-alone Windows installer (experimental)
        run: scripts/package-windows-standalone.sh

      - name: Build Linux package (runs the Python tests)
        run: scripts/package-linux.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts

      # The macOS runner image ships the Android SDK (ANDROID_HOME); Gradle installs the
      # platform and build tools it needs from there.
      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Build Android APK (runs the Kotlin tests)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          scripts/package-android.sh

      - name: Upload Windows installers for signing
        id: unsigned
        if: env.TAG != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: AutoZhuyin-Windows-unsigned
          path: build/AutoZhuyin-Windows-*-setup.exe
          if-no-files-found: error

      - name: Sign Windows installers (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: AutoZhuyin
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400
          output-artifact-directory: build/signed

      - name: Use the signed Windows installers
        if: steps.unsigned.outcome == 'success'
        run: |
          ls -l build/signed
          for f in build/signed/*-setup.exe; do
            test -f "build/$(basename "$f")"
            cp "$f" build/
          done

      - name: Collect files
        run: |
          mkdir -p dist
          cp build/AutoZhuyin-*.pkg build/AutoZhuyin-Windows-*.zip build/AutoZhuyin-Windows-*-setup.exe \
             build/AutoZhuyin-Linux-*.tar.gz dist/
          # A debug-signed APK is only for test builds.
          for apk in build/AutoZhuyin-Android-*.apk; do
            case "$apk" in
              *-debug.apk) if [ -z "$TAG" ]; then cp "$apk" dist/; fi ;;
              *) cp "$apk" dist/ ;;
            esac
          done
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload test build
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: AutoZhuyin-test-build
          path: dist/*

      - name: Publish GitHub Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, above GitHub's generated compare link.
          awk -v tag="$TAG" '/^## / { if (s) exit; if (index($0, "## " tag "（") == 1) { s = 1; next } } s' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "AutoZhuyin $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes --verify-tag
          fi
